name: Lean checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make setup build lint test bench
      - run: .venv/bin/pip-audit --skip-editable
      - run: npm --prefix apps/web audit --audit-level=high
      - run: docker build -t lean:test .
      - run: .venv/bin/python scripts/container_smoke.py
